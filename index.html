<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241d59">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Азбука с Ори</title>
<style>
  :root { --bg1:#17133f; --bg2:#493787; --ink:#31245f; --purple:#7256d9; --gold:#ffbf3f; --mint:#62dbc2; --panel:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; overscroll-behavior:none; }
  body { background:linear-gradient(var(--bg1),var(--bg2)) fixed; color:var(--ink); font-family:system-ui,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  button { font:inherit; color:inherit; }
  #app { max-width:720px; margin:0 auto; min-height:100vh; }
  .screen { display:none; flex-direction:column; min-height:100vh; padding-bottom:18px; }
  .screen.on { display:flex; }
  .top { display:flex; align-items:center; gap:8px; padding:10px 12px 5px; color:#fff; }
  .ttl { flex:1; font-weight:850; font-size:clamp(16px,4vw,23px); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 4px #0004; }
  .ib { border:0; background:#fff; color:var(--ink); border-radius:14px; width:44px; height:44px; font-size:22px; cursor:pointer; box-shadow:0 3px 8px #0003; flex:none; }
  #back,#shopBack { width:auto; min-width:92px; padding:0 12px; font-size:16px; font-weight:800; white-space:nowrap; }
  .wallet { display:flex; align-items:center; gap:5px; background:#fff; border-radius:22px; padding:5px 11px 5px 7px; color:var(--ink); font-weight:900; font-size:19px; box-shadow:0 3px 8px #0003; position:relative; flex:none; }
  .wallet svg { width:25px; height:25px; }
  .float { position:absolute; right:2px; top:-5px; color:#ffe16b; font-size:20px; animation:up 1.1s ease-out forwards; pointer-events:none; }
  @keyframes up { to { transform:translateY(-38px); opacity:0; } }
  .bubble { position:relative; background:#fff; border-radius:18px; padding:11px 14px; font-size:17px; font-weight:650; line-height:1.35; box-shadow:0 4px 12px #0003; min-height:50px; cursor:pointer; }
  .bubble::after { content:""; position:absolute; left:35%; bottom:-9px; border:9px solid transparent; border-top-color:#fff; border-bottom:0; }
  .hero { padding:5px 12px 0; }
  .stage { position:relative; height:255px; margin-top:10px; border-radius:25px; overflow:hidden; background:radial-gradient(circle at 80% 10%,#806ad0 0 2%,transparent 3%),linear-gradient(#29205e 0 64%,#8b74c9 64% 68%,#51408f 68%); box-shadow:inset 0 0 0 2px #ffffff30,0 5px 16px #0004; }
  .stage::before { content:"✦  ·  ✧  ·  ✦  ·  ✧"; position:absolute; top:12px; left:15px; right:15px; color:#fff9; font-size:23px; letter-spacing:9px; }
  .stage .window { position:absolute; width:112px; height:82px; border:7px solid #b6a8ec; border-radius:50%; right:7%; top:29px; background:radial-gradient(circle at 65% 35%,#ffcf65 0 4%,transparent 5%),radial-gradient(circle at 30% 70%,#fff 0 2%,transparent 3%),linear-gradient(#101637,#285790); box-shadow:0 0 20px #7ccfff44; }
  .charwrap { position:absolute; transform-origin:50% 100%; }
  .charwrap svg { display:block; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 4px 2px #0003); }
  .charwrap.idle { animation:breathe 3s ease-in-out infinite; }
  .charwrap.hop { animation:hop .45s ease-out 2; }
  .charwrap.think { animation:think .6s ease-in-out 2; }
  @keyframes breathe { 50% { transform:scale(1.02,.985); } }
  @keyframes hop { 40% { transform:translateY(-12%) scale(1.04); } }
  @keyframes think { 50% { transform:rotate(-4deg); } }
  .stage .ori { left:6%; bottom:0; width:150px; height:205px; z-index:3; }
  .stage .lulu { left:36%; bottom:2%; width:105px; height:132px; z-index:4; }
  .stage .bip { left:54%; bottom:2%; width:88px; height:145px; z-index:3; }
  .stage .tum { left:69%; bottom:1%; width:105px; height:120px; z-index:4; }
  .stage .neema { left:82%; bottom:8%; width:72px; height:105px; z-index:2; animation:floaty 2.7s ease-in-out infinite alternate; }
  @keyframes floaty { to { transform:translateY(-10px) rotate(3deg); } }
  .mainbtn { display:block; width:calc(100% - 24px); margin:11px 12px 0; border:0; border-radius:17px; padding:12px; font-size:18px; font-weight:850; color:#fff; background:linear-gradient(#7fe3ca,#42bfa8); box-shadow:0 4px 0 #238d7a; cursor:pointer; }
  .mainbtn:active { transform:translateY(2px); box-shadow:0 2px 0 #238d7a; }
  .vrow { display:block; width:calc(100% - 24px); margin:10px 12px 0; border:0; border-radius:12px; padding:8px 10px; font-size:13px; line-height:1.3; font-weight:700; color:var(--ink); background:#ffffffdf; cursor:pointer; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:13px 12px 4px; }
  .sect { grid-column:1/-1; color:#fff; font-size:15px; font-weight:850; margin:8px 2px -2px; text-shadow:0 2px 3px #0004; }
  .card { position:relative; border:0; border-radius:18px; padding:10px 4px 8px; min-height:105px; background:#fff; box-shadow:0 4px 0 #c9bfe9,0 6px 12px #0003; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .card:active { transform:translateY(2px); box-shadow:0 2px 0 #c9bfe9; }
  .card .ic { min-height:43px; display:flex; align-items:center; justify-content:center; font-size:33px; font-weight:900; color:var(--purple); }
  .card b { font-size:13px; line-height:1.15; min-height:29px; display:flex; align-items:center; text-align:center; }
  .card i { font-style:normal; color:var(--gold); font-size:14px; letter-spacing:1px; }
  .host { display:flex; align-items:center; gap:5px; min-height:132px; padding:0 12px; }
  .host .pair { position:relative; width:125px; height:128px; flex:none; }
  .host .ori { left:0; bottom:0; width:82px; height:116px; }
  .host .student { right:0; bottom:0; width:59px; height:72px; z-index:2; }
  .host .bubble { flex:1; max-height:132px; overflow-y:auto; font-size:16px; }
  .host .bubble::after { left:-9px; top:48%; bottom:auto; border:9px solid transparent; border-right-color:#fff; border-left:0; }
  #board { position:relative; margin:4px 12px 0; min-height:265px; border-radius:25px; background:linear-gradient(145deg,#fff,#f0ebff); box-shadow:0 5px 15px #0004; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px; padding:17px 12px; overflow:hidden; text-align:center; }
  #board:empty { display:none; }
  .bigletter { font-size:clamp(100px,26vw,165px); line-height:.9; font-weight:900; color:var(--purple); text-shadow:0 5px 0 #dfd5ff; }
  .letterpair { display:flex; align-items:baseline; gap:28px; font-weight:900; color:var(--purple); }
  .letterpair .up { font-size:112px; line-height:1; }
  .letterpair .low { font-size:94px; line-height:1; color:#dd6ea8; }
  .picture { font-size:82px; line-height:1; filter:drop-shadow(0 4px 2px #0002); }
  .caption { font-size:25px; font-weight:850; }
  .word { font-size:clamp(31px,8vw,49px); line-height:1.15; font-weight:900; letter-spacing:3px; color:var(--purple); }
  .sentence { font-size:clamp(27px,6.5vw,40px); line-height:1.3; font-weight:850; }
  .mini { font-size:15px; font-weight:650; opacity:.72; }
  .merge { display:flex; align-items:center; justify-content:center; gap:15px; font-size:58px; font-weight:900; color:var(--purple); }
  .merge .plus { color:#e695b9; font-size:40px; }
  .soundmark { color:#d54f8d; }
  #act { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; padding:12px 12px 0; min-height:78px; }
  .btn { border:0; border-radius:18px; padding:13px 20px; min-width:66px; min-height:54px; background:#fff; box-shadow:0 4px 0 #bdb1df,0 5px 9px #0003; font-size:20px; font-weight:850; cursor:pointer; transition:transform .15s,box-shadow .15s,opacity .15s; }
  .btn:active { transform:translateY(2px); box-shadow:0 2px 0 #bdb1df; }
  .btn.next { color:#fff; background:var(--purple); box-shadow:0 4px 0 #49349e; padding-left:30px; padding-right:30px; }
  .btn.choice { min-width:82px; font-size:28px; }
  .btn.wordchoice { font-size:23px; letter-spacing:1px; }
  .btn.picchoice { font-size:46px; min-width:78px; padding:8px 13px; }
  .btn.right { background:#55ce8b; color:#fff; box-shadow:0 4px 0 #2e9760; }
  .btn.wrongb { background:#ffd6df; opacity:.55; }
  .btn.reading { transform:scale(1.08); box-shadow:0 0 0 4px #ffd251,0 4px 0 #bdb1df; }
  .btn.hint { animation:hint 1s ease-in-out infinite; box-shadow:0 0 0 5px #ffd251,0 4px 0 #bdb1df; }
  @keyframes hint { 50% { transform:scale(1.08); } }
  .many { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; width:100%; max-width:440px; }
  .many .btn { padding:10px 5px; font-size:34px; }
  .many .btn.found { opacity:.25; transform:scale(.85); }
  .slots { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; }
  .slot { width:49px; height:60px; border-radius:12px; background:#e4dcf7; box-shadow:inset 0 0 0 2px #c2b4e6; display:flex; align-items:center; justify-content:center; font-size:37px; font-weight:900; color:var(--purple); }
  .slot.filled { background:#fff4c9; animation:pop .25s ease-out; }
  @keyframes pop { from { transform:scale(.4); } 70% { transform:scale(1.12); } }
  .spark { position:fixed; z-index:60; font-size:20px; pointer-events:none; animation:spark 1s ease-out forwards; }
  @keyframes spark { to { transform:translate(var(--dx),var(--dy)) scale(1.2); opacity:0; } }
  .cf { position:fixed; top:-14px; width:9px; height:13px; border-radius:2px; z-index:55; pointer-events:none; animation:cf 1.8s linear forwards; }
  @keyframes cf { to { transform:translateY(80vh) rotate(720deg); opacity:.1; } }
  .items { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; padding:13px 12px 5px; }
  .item { border:0; border-radius:18px; padding:8px 3px; background:#fff; box-shadow:0 4px 0 #bdb1df; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .item .pv { font-size:43px; height:53px; }
  .item b { font-size:12px; line-height:1.15; min-height:28px; display:flex; align-items:center; }
  .item span { font-size:13px; font-weight:850; display:flex; align-items:center; gap:3px; }
  .item span svg { width:16px; height:16px; }
  .item:not(.own) .pv { filter:grayscale(.5); opacity:.65; }
  .item.own:not(.on) .pv { opacity:.45; }
  .item.on { outline:4px solid var(--gold); }
  .item.poor { opacity:.55; }
  .themes { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:10px 12px; }
  .themes button { border:0; border-radius:14px; padding:8px 12px; background:#fff; font-weight:750; cursor:pointer; }
  .themes button.on { color:#fff; background:var(--purple); }
  .tiny { display:block; margin:18px auto 0; border:0; background:none; color:#ffffffaa; text-decoration:underline; cursor:pointer; }
  .overlay { position:fixed; inset:0; z-index:70; background:#110d35bb; display:none; align-items:center; justify-content:center; padding:16px; }
  .overlay.on { display:flex; }
  .res { width:100%; max-width:390px; background:linear-gradient(#fff,#eee7ff); border-radius:27px; padding:20px; text-align:center; }
  .res h2 { margin:0 0 8px; font-size:26px; }
  .res .stars { color:var(--gold); font-size:48px; letter-spacing:4px; }
  .res .stars .off { color:#d8d0ea; }
  .res .got { display:flex; justify-content:center; align-items:center; gap:6px; font-size:23px; font-weight:900; margin:7px 0 15px; }
  .res .got svg { width:29px; height:29px; }
  .res .row { display:flex; gap:10px; }
  .res .row .btn { flex:1; padding-left:8px; padding-right:8px; }
  #novoice .res { text-align:left; }
  #novoice h2 { text-align:center; }
  #novoice p { font-size:15px; line-height:1.4; }
  .giftdecor { position:absolute; z-index:5; pointer-events:none; font-size:40px; }
  .gd-garland { left:20%; right:4%; top:0; font-size:31px; letter-spacing:8px; animation:glow 1.5s ease-in-out infinite alternate; }
  .gd-holo { right:25%; top:29px; animation:floaty 2s ease-in-out infinite alternate; }
  .gd-lamp { left:2%; top:18px; }
  .gd-music { left:30%; bottom:2%; pointer-events:auto; cursor:pointer; }
  .gd-plant { right:1%; bottom:1%; }
  .gd-robot { right:32%; bottom:0; pointer-events:auto; cursor:pointer; }
  @keyframes glow { to { filter:brightness(1.5) drop-shadow(0 0 6px #fff); } }
  @media (max-width:480px) {
    .cards { grid-template-columns:repeat(3,1fr); gap:9px; }
    .stage { height:225px; }
    .stage .ori { width:128px; height:184px; left:2%; }
    .stage .lulu { left:32%; width:91px; height:119px; }
    .stage .bip { left:51%; width:76px; height:128px; }
    .stage .tum { left:66%; width:91px; height:108px; }
    .stage .neema { left:84%; width:57px; height:88px; }
    .items { grid-template-columns:repeat(3,1fr); }
    #board { min-height:250px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen on">
    <header class="top"><div class="wallet"></div><div class="ttl">Азбука с Ори</div><button class="ib" id="snd" title="Звук">🔊</button><button class="ib" id="toShop" title="Подарки">🎁</button></header>
    <div class="hero"><div class="bubble"></div><div class="stage"></div></div>
    <button class="mainbtn" id="continue">▶ Начать приключение</button>
    <button class="vrow"></button>
    <div class="cards" id="cards"></div>
  </section>
  <section id="lesson" class="screen">
    <header class="top"><button class="ib" id="back" title="Назад">← Назад</button><div class="ttl" id="lTitle"></div><div class="wallet"></div></header>
    <div class="host"><div class="pair"></div><div class="bubble" id="bubble"></div></div>
    <div id="board"></div><div id="act"></div>
  </section>
  <section id="shop" class="screen">
    <header class="top"><button class="ib" id="shopBack" title="Назад">← Назад</button><div class="ttl">Подарки для корабля</div><div class="wallet"></div></header>
    <div class="hero"><div class="bubble"></div><div class="stage"></div></div>
    <div class="items" id="items"></div><div class="themes" id="themes"></div><button class="vrow"></button><button class="tiny" id="reset">Сбросить прогресс</button>
  </section>
  <div class="overlay" id="result"><div class="res"><h2>Урок пройден!</h2><div class="stars" id="rStars"></div><div class="got" id="rGot"></div><div class="row"><button class="btn" id="rAgain">↺ Ещё раз</button><button class="btn next" id="rMenu">Дальше ▶</button></div></div></div>
  <div class="overlay" id="novoice"><div class="res"><h2>Ори пока молчит</h2><div class="txt"></div><div class="row"><button class="btn" id="nvOff">Не показывать</button><button class="btn next" id="nvOk">Понятно</button></div></div></div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const CRYSTAL = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 35 13 29 34 11 34 5 13Z" fill="#6ee7f3" stroke="#fff" stroke-width="2"/><path d="m20 2 2 32 7-21Z" fill="#25a9df"/><path d="M5 13h30L20 2Z" fill="#c5fbff" opacity=".75"/></svg>';

function oriSVG(mood = 'neutral') {
  const mouth = mood === 'happy' ? '<path d="M77 111 Q100 134 123 111 Q119 143 100 144 Q81 142 77 111" fill="#592d63"/><path d="M87 133 Q100 125 113 133" stroke="#f58fa2" stroke-width="7" stroke-linecap="round"/>' : mood === 'think' ? '<path d="M88 126 Q101 119 114 126" fill="none" stroke="#592d63" stroke-width="5" stroke-linecap="round"/>' : '<path d="M84 122 Q100 133 117 121" fill="none" stroke="#592d63" stroke-width="5" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 200 240" aria-label="Ори"><path d="M58 198 Q25 212 26 240H174Q175 211 142 198" fill="#6550a5"/><path d="M65 177 43 227 157 227 135 177" fill="#8b72d0"/><path d="M100 181v46M68 205h64" stroke="#d8c8ff" stroke-width="5"/><circle cx="100" cy="200" r="10" fill="#7df1e0"/><path d="M52 73Q23 84 35 117Q48 105 58 110M148 73Q177 84 165 117Q152 105 142 110" fill="#69c9b5"/><ellipse cx="100" cy="102" rx="65" ry="78" fill="#7edac5"/><path d="M68 39Q58 9 76 8Q89 9 84 34M116 34Q111 8 127 7Q145 10 132 42" fill="#7edac5"/><circle cx="76" cy="9" r="6" fill="#ffe277"/><circle cx="128" cy="8" r="6" fill="#ffe277"/><ellipse cx="75" cy="88" rx="23" ry="28" fill="#fff"/><ellipse cx="125" cy="88" rx="23" ry="28" fill="#fff"/><ellipse cx="78" cy="91" rx="10" ry="15" fill="#31245f"/><ellipse cx="122" cy="91" rx="10" ry="15" fill="#31245f"/><circle cx="81" cy="85" r="4" fill="#fff"/><circle cx="125" cy="85" r="4" fill="#fff"/><path d="M51 62Q74 44 91 61M109 61Q128 44 150 63" stroke="#f2f0df" stroke-width="10" stroke-linecap="round" fill="none"/>${mouth}<path d="M58 125Q45 165 70 183L78 161 87 190 100 164 113 190 123 160 132 182Q156 159 141 124 126 148 100 148 74 148 58 125" fill="#f2f0df"/><path d="M48 199Q22 197 18 216M151 199Q177 197 183 216" stroke="#7edac5" stroke-width="15" stroke-linecap="round"/></svg>`;
}
function studentSVG(id, mood = 'neutral') {
  const smile = mood === 'happy' ? 'M75 121Q100 145 125 121' : 'M80 123Q100 136 120 123';
  if (id === 'lulu') return `<svg viewBox="0 0 200 240" aria-label="Лулу"><path d="M42 223Q30 156 48 80Q62 24 102 26Q151 27 159 87Q169 164 153 223" fill="#ef87bc"/><path d="M57 56Q31 34 42 20M140 54Q169 32 157 17" stroke="#ef87bc" stroke-width="12" stroke-linecap="round"/><circle cx="42" cy="18" r="9" fill="#ffe274"/><circle cx="158" cy="16" r="9" fill="#ffe274"/>${[[68,80],[129,80],[99,117]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="20" ry="23" fill="#fff"/><circle cx="${x}" cy="${y+2}" r="9" fill="#382459"/><circle cx="${x+3}" cy="${y-2}" r="3" fill="#fff"/>`).join('')}<path d="${smile}" stroke="#713055" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M44 169Q14 176 24 199M155 169Q185 176 176 199" stroke="#ef87bc" stroke-width="14" stroke-linecap="round"/><path d="M63 221v15M137 221v15" stroke="#ef87bc" stroke-width="20" stroke-linecap="round"/></svg>`;
  if (id === 'bip') return `<svg viewBox="0 0 200 240" aria-label="Бип"><path d="M65 231Q48 174 54 84Q57 33 99 28Q145 32 147 88Q153 175 134 231" fill="#68bfea"/><path d="M98 30Q87 6 100 3Q116 3 110 29" fill="#68bfea"/><circle cx="102" cy="4" r="7" fill="#ffdc67"/><ellipse cx="101" cy="94" rx="42" ry="47" fill="#fff"/><ellipse cx="102" cy="98" rx="20" ry="28" fill="#283765"/><circle cx="109" cy="87" r="7" fill="#fff"/><path d="${smile}" stroke="#274e78" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M57 157Q24 164 32 199M144 157Q175 164 168 199M76 230v7M125 230v7" stroke="#68bfea" stroke-width="15" stroke-linecap="round"/></svg>`;
  if (id === 'tum') return `<svg viewBox="0 0 200 240" aria-label="Тум"><path d="M43 225 31 207 45 190 29 171 45 153 31 131 47 115 38 89 58 80 56 51 80 51 96 28 113 47 139 35 145 60 168 68 159 94 175 112 161 133 173 155 155 170 163 198 145 205 143 229" fill="#f3a44f"/><path d="M68 59Q46 28 60 18 79 20 85 52M123 53Q132 20 150 22 159 38 139 65" fill="#f3a44f"/><ellipse cx="73" cy="105" rx="21" ry="25" fill="#fff"/><ellipse cx="128" cy="105" rx="21" ry="25" fill="#fff"/><circle cx="75" cy="108" r="10" fill="#573349"/><circle cx="126" cy="108" r="10" fill="#573349"/><path d="${smile}" stroke="#713f32" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M52 166Q20 171 30 199M150 166Q181 171 171 199M68 224v12M132 224v12" stroke="#f3a44f" stroke-width="17" stroke-linecap="round"/></svg>`;
  return `<svg viewBox="0 0 200 240" aria-label="Нима"><path d="M53 118Q40 46 98 31Q161 39 149 119L139 172 122 150 105 180 88 151 66 174Z" fill="#9bdc70"/><path d="M68 47Q47 24 58 12M132 47Q153 24 143 12" stroke="#9bdc70" stroke-width="10" stroke-linecap="round"/><circle cx="58" cy="11" r="7" fill="#ed83c1"/><circle cx="143" cy="11" r="7" fill="#ed83c1"/><ellipse cx="77" cy="89" rx="22" ry="28" fill="#fff"/><ellipse cx="124" cy="89" rx="22" ry="28" fill="#fff"/><ellipse cx="78" cy="93" rx="10" ry="16" fill="#314b4a"/><ellipse cx="123" cy="93" rx="10" ry="16" fill="#314b4a"/><path d="${smile}" stroke="#42613f" stroke-width="6" stroke-linecap="round" fill="none"/></svg>`;
}
const STUDENTS = [
  { id:'lulu', name:'Лулу', hi:'Привет! Я Лулу. Я уже умею считать до трёх — по числу моих глаз!' },

async function askChoice({text,voice,options,scene:sc,readOptions=true,success,hint,hintVoice}) {
  if(sc!==undefined)scene(sc);let tries=0;
  const answer=await waitable(res=>{
    const a=$('#act');a.innerHTML='';options.forEach(o=>{
      const el=document.createElement('button');el.className='btn choice '+(o.cls||'');el.innerHTML=o.html||o.label;el.dataset.speech=o.speech||o.label||'';
      el.onclick=()=>{if(el.disabled)return;if(o.ok){el.classList.add('right');[...a.children].forEach(b=>b.disabled=true);res(o);}else{tries++;L.errors++;el.classList.add('wrongb');el.disabled=true;oops(o.say);if(tries>=2){const good=[...a.children].find((b,i)=>options[i].ok&&!b.disabled);if(good)good.classList.add('hint');if(hint)say(hint,hintVoice);}}};
      a.appendChild(el);

  await askSequence({text:'Собери мягкий слог МЯ.',voice:`Собери мягкий слог ${syllToken('МЯ')}.`,answer:'МЯ',success:{text:'Верно! Мягкий слог МЯ!',voice:`Верно! Мягкий слог ${syllToken('МЯ')}!`}});
  await readPicture('МЯСО','🍖',[{word:'сок',icon:'🧃'},{word:'мама',icon:'👩'},{word:'луна',icon:'🌙'}]);
  await askChoice({text:'Послушай и найди мягкий слог ЛЮ.',voice:`Найди мягкий слог ${syllToken('ЛЮ')}.`,options:shuffle(['ЛЮ','ЛУ','ЛА'].map(x=>({label:x,ok:x==='ЛЮ'}))),readOptions:false});
}
async function lessonYo() {
  await tell('У буквы Ё всегда есть две точки. Она не любит лениться: в слове ёлка слышится [йо].',{scene:letterScene(LETTER.Ё)});
  await askChoice({text:'Найди букву Ё с двумя точками.',voice:`Найди букву ${nameToken('Ё')} с двумя точками.`,options:optionsForLetters('Ё'),readOptions:false});
  await seqWord('ЛЁД','🧊');
  await readPicture('ЁЛКА','🎄',[{word:'утка',icon:'🦆'},{word:'окно',icon:'🪟'},{word:'дом',icon:'🏠'}]);
  await missingLetter('ПОЁТ','Ё','🎤');
}
async function lessonSoftWords() {
  await tell('Мягкий знак не читается отдельно. Он меняет предыдущий согласный: ДЕНЬ.',{scene:pictureScene('📅','ДЕНЬ')});
  await readPicture('МЫШЬ','🐁',[{word:'жук',icon:'🪲'},{word:'кот',icon:'🐱'},{word:'шар',icon:'🎈'}]);
  await seqWord('ДЕНЬ','📅');
  await missingLetter('СЕМЬЯ','Ь','👨‍👩‍👧');
  await choosePrinted('ПОДЪЕЗД','🏢',['ПОЕЗД','ПОДАРОК','ПОБЕДА']);
}
async function lessonWords() {
  await tell('Читаем целые слова! Сначала по слогам, потом попробуй прочитать сразу.',{scene:'<div class="word">ДОМ · РЫБА · ЖУК</div>'});
  await seqWord('ДОМ','🏠');
  await readPicture('РЫБА','🐟',[{word:'юбка',icon:'👗'},{word:'ваза',icon:'🏺'},{word:'хлеб',icon:'🍞'}]);
  await choosePrinted('ЖУК','🪲',['ЖАР','ЖИР','ЖУР']);
  await seqWord('ЧАШКА','☕');
  await readPicture('ЩЁТКА','🪥',[{word:'ёлка',icon:'🎄'},{word:'цветок',icon:'🌸'},{word:'чашка',icon:'☕'}]);
}
async function lessonPicture() {
  await tell('Теперь читаем без подсказки голосом. Слово прозвучит только после верного ответа.',{scene:'<div class="word">ЧИТАЙ САМ!</div>'});
  await readPicture('ЗОНТ','☂️',[{word:'флаг',icon:'🚩'},{word:'шар',icon:'🎈'},{word:'торт',icon:'🎂'}]);
  await readPicture('ФЛАГ','🚩',[{word:'гриб',icon:'🍄'},{word:'зонт',icon:'☂️'},{word:'банан',icon:'🍌'}]);
  await readPicture('ВАЗА','🏺',[{word:'цветок',icon:'🌸'},{word:'игла',icon:'🪡'},{word:'юбка',icon:'👗'}]);
  await readPicture('ХЛЕБ','🍞',[{word:'сыр',icon:'🧀'},{word:'сок',icon:'🧃'},{word:'рыба',icon:'🐟'}]);
}
async function lessonMissing() {
  await tell('Одна буква спряталась! Прочитай слово и верни её на место.',{scene:'<div class="word">М_МА</div>'});
  await missingLetter('МАМА','М','👩');
  await missingLetter('ЛУНА','Н','🌙');
  await missingLetter('ДОМ','О','🏠');
  await missingLetter('РЫБА','Ы','🐟');
  await missingLetter('ЯБЛОКО','Я','🍎');
}
async function lessonSentences() {
  await tell('Слова дружат в предложениях. Прочитай предложение и ответь на вопрос.',{scene:'<div class="sentence">МАМА ДОМА.</div>'});
  await sentenceTask('МАМА ДОМА.','Где мама?',['Дома','На Луне','В воде'],'🏠');
  await sentenceTask('КОТ СПИТ.','Что делает кот?',['Спит','Летает','Читает'],'🐱');
  await sentenceTask('ЛУНА В НЕБЕ.','Где Луна?',['В небе','В вазе','Под домом'],'🌙');
  await sentenceTask('РЫБА ПЛЫВЁТ.','Кто плывёт?',['Рыба','Жук','Кот'],'🐟');
}
async function lessonReview() {
  await tell('Большое звёздное повторение! Вспомним буквы, слоги, слова и предложения.',{scene:'<div class="picture">🏆</div><div class="caption">Ты готов!</div>'});
  await askChoice({text:'Найди букву, с которой начинается слово «яблоко».',voice:`Найди букву, с которой начинается слово яблоко.`,options:optionsForLetters('Я'),scene:pictureScene('🍎')});
  await askChoice({text:'Прочитай и найди слог ЧА.',voice:`Прочитай и найди слог ${syllToken('ЧА')}.`,options:shuffle(['ЧА','ЧУ','ША','ЦА'].map(x=>({label:x,ok:x==='ЧА'}))),readOptions:false});
  await seqWord('ЦВЕТОК','🌸');
  await missingLetter('ЙОГУРТ','Й','🥛');
  await sentenceTask('ЖУК СИДИТ НА ЦВЕТКЕ.','Где сидит жук?',['На цветке','На Луне','В чашке'],'🪲');
}
const readDef=(id,name,icon,run,sect)=>({id,name,icon,run,sect});
const LESSONS=[
  letterDef('А','Первые гласные'),letterDef('О'),letterDef('У'),letterDef('Ы'),letterDef('Э'),
  letterDef('М','Первые согласные'),letterDef('Н'),letterDef('Л'),letterDef('Р'),letterDef('С'),
  readDef('blend','Соединяем звуки в слог','М+А',lessonBlend,'Первые слоги и слова'),readDef('syllables','Читаем слоги','МА',lessonSyllables),readDef('firstWords','Первые слова','👩',lessonFirstWords),readDef('buildWords','Собираем слова','🧩',lessonBuildWords),
  letterDef('Т','Новые согласные'),letterDef('Д'),letterDef('П'),letterDef('Б'),letterDef('К'),letterDef('Г'),
  letterDef('И','Гласные-подсказки'),letterDef('Е'),letterDef('Ё'),letterDef('Ю'),letterDef('Я'),
  readDef('soft','Твёрдо и мягко','МА · МЯ',lessonSoft,'Мягкость и чтение'),readDef('yo','Читаем слова с Ё','Ё',lessonYo),
  letterDef('З','Ещё согласные'),letterDef('Ф'),letterDef('В'),letterDef('Х'),letterDef('Й'),
  letterDef('Ш','Шипящие и особенные'),letterDef('Ж'),letterDef('Ч'),letterDef('Щ'),letterDef('Ц'),
  letterDef('Ь','Буквы без звука'),letterDef('Ъ'),
  readDef('softWords','Мягкий знак в словах','Ь',lessonSoftWords,'Читаем уверенно'),readDef('words','Слова из 3–5 букв','📖',lessonWords),readDef('picture','Слово и картинка','🖼️',lessonPicture),readDef('missing','Недостающая буква','❔',lessonMissing),readDef('sentences','Первые предложения','💬',lessonSentences),readDef('review','Большое повторение','🏆',lessonReview)
];

// Экраны, награды и подарки
function menu() {
  abortAll();L=null;actions([]);hush();MOOD='neutral';show('menu');
  const c=$('#cards');c.innerHTML='';LESSONS.forEach((l,i)=>{if(l.sect)c.insertAdjacentHTML('beforeend',`<div class="sect">${l.sect}</div>`);const st=S.stars[l.id]||0,b=document.createElement('button');b.className='card';b.innerHTML=`<div class="ic">${l.icon}</div><b>${i+1}. ${l.name}</b><i>${'★'.repeat(st)}${'☆'.repeat(3-st)}</i>`;b.onclick=()=>{sfx('tap');runLesson(l);};c.appendChild(b);});
  const next=LESSONS.find(l=>!(S.stars[l.id]>0))||LESSONS[0];$('#continue').textContent=Object.keys(S.stars).length?'▶ Продолжить обучение':'▶ Начать приключение';$('#continue').onclick=()=>runLesson(next);
  say(pick(['Привет! Я Ори, хранитель звёздной библиотеки. Выбирай урок!','Мои ученики прилетели с разных планет. Вместе мы откроем тайну русских букв!','За верные ответы — кристаллы. На них можно украсить наш корабль!','Каждая буква — маленькая звезда. Соберём из них целое созвездие слов!']));
}
async function runLesson(def,again=false) {
  abortAll();actions([]);scene('');const student=again&&L?L.student:(S.student=(S.student+1)%STUDENTS.length);save();L={def,errors:0,earned:0,student};show('lesson');$('#lTitle').textContent=def.name;
  try { if(!again){const st=STUDENTS[student];say(st.hi,undefined,'student');await wait(2100);MOOD='neutral';drawChars();}await def.run();await finishLesson(); } catch(e){if(!(e instanceof Abort)){console.error(e);menu();}}
}
async function finishLesson() {
  const stars=L.errors<=1?3:L.errors<=4?2:1,fresh=Math.max(0,stars-(S.stars[L.def.id]||0));if(fresh)addCoins(fresh*5);S.stars[L.def.id]=Math.max(S.stars[L.def.id]||0,stars);save();
  $('#rStars').innerHTML='★'.repeat(stars)+`<span class="off">${'★'.repeat(3-stars)}</span>`;$('#rGot').innerHTML=CRYSTAL+` +${L.earned}`;$('#result').classList.add('on');MOOD='happy';sfx('win');if(shown('fireworks'))fireworks();speak(stars===3?'Урок пройден! Три звезды! Ты настоящий читатель!':'Урок пройден! Молодец!');
  const again=await waitable(res=>{$('#rAgain').onclick=()=>res(true);$('#rMenu').onclick=()=>res(false);});$('#result').classList.remove('on');if(again)runLesson(L.def,true);else menu();
}
function shop() {
  show('shop');const box=$('#items');box.innerHTML='';GIFTS.forEach(g=>{const own=S.gifts.includes(g.id),on=shown(g.id),b=document.createElement('button');b.className='item '+(own?'own ':'')+(on?'on ':'')+(S.coins<g.price&&!own?'poor':'');b.innerHTML=`<div class="pv">${g.icon}</div><b>${g.name}</b><span>${own?(on?'Показан ✓':'Спрятан'):CRYSTAL+g.price}</span>`;b.onclick=()=>{
    if(!own){if(S.coins<g.price){say(`Нужно ещё ${g.price-S.coins} кристаллов. Пройди ещё один урок!`);return;}S.coins-=g.price;S.gifts.push(g.id);S.shown.push(g.id);save();sfx('win');say(g.hi);}
    else{const i=S.shown.indexOf(g.id);if(i<0)S.shown.push(g.id);else S.shown.splice(i,1);save();sfx('tap');}
    shop();
  };box.appendChild(b);});
  const themes=$('#themes');themes.innerHTML='';if(shown('paint')){themes.innerHTML='<div class="mini" style="width:100%;color:#fff">Цвет каюты:</div>';THEMES.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[0];b.className=i===S.theme?'on':'';b.onclick=()=>{S.theme=i;save();applyTheme();shop();};themes.appendChild(b);});}
  voiceShow();
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-gift]');if(!g)return;if(g.dataset.gift==='music'){melody();say('Орбитрон играет мелодию звёздного класса!');}if(g.dataset.gift==='robot'){say('Бип-боп! Я тоже хочу учиться читать!',undefined,'student');}});
$('#back').onclick=()=>{sfx('tap');menu();};$('#toShop').onclick=()=>{sfx('tap');shop();say('Это подарки для нашего корабля. Купленный подарок можно показать или спрятать.');};$('#shopBack').onclick=()=>{sfx('tap');menu();};
$('#snd').onclick=()=>{S.sound=!S.sound;save();$('#snd').textContent=S.sound?'🔊':'🔇';if(!S.sound)hush();voiceShow();};
$('#reset').onclick=()=>{if(!confirm('Сбросить кристаллы, звёзды и все подарки?'))return;Object.assign(S,FRESH());save();shop();say('Начинаем новое звёздное путешествие!');};
$('#nvOk').onclick=()=>$('#novoice').classList.remove('on');$('#nvOff').onclick=()=>{S.noVoiceOff=true;save();$('#novoice').classList.remove('on');};
$('#snd').textContent=S.sound?'🔊':'🔇';voiceInit();menu();setTimeout(voiceCheck,2500);
</script>
</body>
</html>
