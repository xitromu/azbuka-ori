<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#282440">
  <meta name="description" content="Читаем с Ори — 104 маленьких приключения от первых букв до историй. Учимся читать, собираем слова и обустраиваем свой корабль.">
  <title>Читаем с Ори</title>
  <link rel="icon" href="img/ori.png">
  <link rel="stylesheet" href="rpg/style.css">
  <script defer src="rpg/learning.js"></script>
  <script defer src="rpg/rewards.js"></script>
  <script defer src="rpg/assets.js"></script>
  <script defer src="rpg/voice-manifest.js"></script>
  <script defer src="rpg/engine.js"></script>
  <script defer src="rpg/store.js"></script>
  <script defer src="rpg/app.js"></script>
</head>
<body>
  <div class="sky-dust" aria-hidden="true"></div>
  <div id="gameFrame">
    <header id="gameHeader"></header>
    <div id="saveWarning" role="alert" hidden></div>
    <main id="screen" tabindex="-1"><p class="loading">Ори готовит корабль…</p></main>
    <nav id="dock" aria-label="Куда отправимся"></nav>
  </div>
  <footer class="page-footer">Читаем с Ори · 3.0.2 · Для маленьких открытий</footer>
  <dialog id="modal" aria-labelledby="modalTitle"><div id="modalContent"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <noscript>Для игры нужен JavaScript. Включи его в настройках браузера.</noscript>
</body>
</html>
